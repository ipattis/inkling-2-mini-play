<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Customers</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>Customers</h1>
    <div class="controls">
      <input type="search" id="q" placeholder="Search name or city" aria-label="Search">
      <label>Rows <select id="size"><option>10</option><option>25</option><option>50</option></select></label>
    </div>
    <div class="scroller">
      <table>
        <thead><tr>
          <th data-key="name">Name</th><th data-key="city">City</th><th data-key="signup">Signup date</th>
          <th data-key="orders">Orders</th><th data-key="spend">Spend</th>
        </tr></thead>
        <tbody id="rows"></tbody>
        <tfoot><tr><td>Total</td><td></td><td></td><td id="tot-orders"></td><td id="tot-spend"></td></tr></tfoot>
      </table>
    </div>
    <p id="empty" hidden>No results</p>
    <div class="pager">
      <button id="prev">Previous</button>
      <span id="status"></span>
      <button id="next">Next</button>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
