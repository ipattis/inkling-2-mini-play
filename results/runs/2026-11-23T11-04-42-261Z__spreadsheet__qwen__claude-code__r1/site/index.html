<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini Spreadsheet</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="toolbar">
      <h1>Mini Spreadsheet</h1>
      <button id="clear" type="button">Clear</button>
    </header>
    <div id="grid" class="grid" aria-label="spreadsheet grid"></div>
    <p class="hint">
      Type a number, text, or a formula starting with <code>=</code>
      (for example <code>=A1+SUM(B1:B3)</code>). Enter commits the cell and moves down;
      changes are saved in your browser.
    </p>
  </main>
  <script src="app.js"></script>
</body>
</html>
