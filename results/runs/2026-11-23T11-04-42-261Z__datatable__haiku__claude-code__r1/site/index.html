<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Customer Data Explorer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <h1>Customer Data Explorer</h1>

    <div class="controls">
      <label class="search">
        <span class="label-text">Search</span>
        <input type="search" id="search" placeholder="Name or city" autocomplete="off">
      </label>
      <label class="size">
        <span class="label-text">Rows per page</span>
        <select id="size">
          <option value="10">10</option>
          <option value="25">25</option>
          <option value="50">50</option>
        </select>
      </label>
    </div>

    <p id="status" class="status" role="status" aria-live="polite">Loading…</p>

    <div class="table-wrap">
      <table id="customers">
        <caption class="visually-hidden">Customers</caption>
        <thead>
          <tr>
            <th scope="col" data-col="name"><button type="button">Name<span class="indicator" aria-hidden="true"></span></button></th>
            <th scope="col" data-col="city"><button type="button">City<span class="indicator" aria-hidden="true"></span></button></th>
            <th scope="col" data-col="signup"><button type="button">Signup date<span class="indicator" aria-hidden="true"></span></button></th>
            <th scope="col" data-col="orders" class="num"><button type="button">Orders<span class="indicator" aria-hidden="true"></span></button></th>
            <th scope="col" data-col="spend" class="num"><button type="button">Spend<span class="indicator" aria-hidden="true"></span></button></th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
        <tfoot>
          <tr>
            <th scope="row" colspan="3">Total (matching rows)</th>
            <td id="total-orders" class="num"></td>
            <td id="total-spend" class="num"></td>
          </tr>
        </tfoot>
      </table>
    </div>

    <nav class="pager" aria-label="Pagination">
      <button type="button" id="prev">Previous</button>
      <span id="page-info"></span>
      <button type="button" id="next">Next</button>
    </nav>
  </main>
  <script src="app.js"></script>
</body>
</html>
