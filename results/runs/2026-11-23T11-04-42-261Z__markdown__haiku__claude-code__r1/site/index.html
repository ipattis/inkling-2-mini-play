<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Markdown Editor</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="toolbar">
    <span class="title">Markdown Editor</span>
    <button id="copy-html" type="button">Copy HTML</button>
  </header>

  <main class="workspace">
    <textarea id="editor" aria-label="Markdown source" spellcheck="false" placeholder="Type Markdown here…"></textarea>
    <div id="preview" aria-label="Rendered preview"></div>
  </main>

  <footer id="status" class="status" role="status">0 words · 0 characters</footer>

  <script src="app.js"></script>
</body>
</html>
