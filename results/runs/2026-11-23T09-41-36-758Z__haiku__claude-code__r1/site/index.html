<!DOCTYPE html>
<html lang="en" data-mode="focus">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#0b0d12" />
  <title>Pomodoro Focus Timer</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header class="top">
      <h1 class="brand">Pomodoro<span>.</span></h1>
      <div class="tabs" role="tablist" aria-label="Timer mode">
        <button class="tab" role="tab" id="tab-focus" data-mode="focus" aria-selected="true" aria-controls="timer">
          Focus <small>25:00</small>
        </button>
        <button class="tab" role="tab" id="tab-break" data-mode="break" aria-selected="false" aria-controls="timer" tabindex="-1">
          Break <small>05:00</small>
        </button>
      </div>
    </header>

    <section class="card timer" id="timer" role="tabpanel" aria-labelledby="tab-focus">
      <div class="ring" id="ring">
        <svg viewBox="0 0 260 260" aria-hidden="true">
          <defs>
            <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" class="stop-a" />
              <stop offset="100%" class="stop-b" />
            </linearGradient>
          </defs>
          <g transform="rotate(-90 130 130)">
            <circle class="ring-track" cx="130" cy="130" r="118" />
            <circle class="ring-progress" id="progress" cx="130" cy="130" r="118" />
          </g>
        </svg>
        <div class="readout">
          <time id="time" aria-live="off">25:00</time>
          <p id="modeLabel">Time to focus</p>
        </div>
      </div>

      <div class="controls">
        <button class="btn btn-primary" id="toggle" type="button">Start</button>
        <button class="btn btn-ghost" id="reset" type="button">Reset</button>
      </div>

      <p class="hint"><kbd>Space</kbd> to start or pause</p>
      <p class="status" id="status" aria-live="polite"></p>
    </section>

    <section class="card stat" aria-label="Sessions completed today">
      <div>
        <p class="stat-label">Sessions completed today</p>
        <p class="stat-value" id="count">0</p>
      </div>
      <div class="dots" id="dots" aria-hidden="true"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
